<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduLearn | Subtest</title>
  <meta name="description" content="Subtest page for Grade 11 mathematics practice questions." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="EduLearn home">
        <span class="brand-mark">E</span>
        <span>EduLearn</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html#materi">Topics</a>
        <a href="subtest.html">Practice</a>
        <a href="index.html#progress">Progress</a>
        <a href="index.html#feedback">Feedback</a>
      </nav>

      <div class="nav-actions">
        <a class="btn btn-ghost" href="index.html#materi">Back to Topics</a>
        <a class="btn btn-primary" href="index.html">Home</a>
      </div>

      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <main class="subtest-page">
    <section class="section">
      <div class="container">
        <div class="section-header center">
          <p>Subtest Page</p>
          <h2>Special practice for PK and PM subtests</h2>
        </div>

        <div class="quiz-box subtest-box">
          <div class="quiz-controls">
            <div class="field-group compact">
              <label for="topicSelect">Choose subtest</label>
              <select id="topicSelect"></select>
            </div>

            <div class="field-group compact">
              <label>Difficulty</label>
              <div class="difficulty-group">
                <button class="difficulty-btn active" data-difficulty="mudah" type="button">Easy</button>
                <button class="difficulty-btn" data-difficulty="sedang" type="button">Medium</button>
                <button class="difficulty-btn" data-difficulty="susah" type="button">Hard</button>
              </div>
            </div>

            <div class="field-group compact">
              <label>Time</label>
              <div class="timer-adjust">
                <button id="decreaseTime" type="button">−</button>
                <input id="timerMinutes" type="number" min="1" max="60" value="10" />
                <button id="increaseTime" type="button">+</button>
              </div>
            </div>

            <div class="field-group compact">
              <label for="questionCount">Number of questions</label>
              <input id="questionCount" type="number" min="5" max="50" value="10" />
            </div>

            <label class="toggle-row">
              <input id="untimedMode" type="checkbox" />
              <span>Untimed mode</span>
            </label>
          </div>

          <div class="quiz-actions">
            <button id="startSubtest" class="btn btn-primary" type="button">Start Subtest</button>
            <button id="startExam" class="btn btn-secondary" type="button">Full Review Exam</button>
          </div>

          <div id="quizArea" class="quiz-area hidden"></div>
          <div id="resultsArea" class="results-area hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <section id="feedback" class="section feedback-section">
    <div class="container">
      <div class="section-header center">
        <p>Feedback &amp; Suggestions</p>
        <h2>Share your opinion to improve the app</h2>
      </div>

      <div class="feedback-card">
        <form id="feedbackForm" class="feedback-form">
          <div class="field-group">
            <label for="feedbackType">Feedback type</label>
            <select id="feedbackType" name="type">
              <option value="saran">Suggestion</option>
              <option value="kritik">Criticism</option>
              <option value="request">Feature request</option>
            </select>
          </div>

          <div class="field-group">
            <label for="feedbackMessage">Message</label>
            <textarea id="feedbackMessage" name="message" rows="5" placeholder="Write your suggestion, criticism, or app improvement idea..." required></textarea>
          </div>

          <button class="btn btn-primary" type="submit">Send Feedback</button>
        </form>
        <p id="feedbackStatus" class="feedback-status" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <div>© <span id="current-year">2026</span> EduLearn. All rights reserved.</div>
      <div class="footer-links">
        <a href="index.html#materi">Topics</a>
        <a href="subtest.html">Practice</a>
        <a href="index.html#progress">Progress</a>
        <a href="index.html#feedback">Feedback</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
