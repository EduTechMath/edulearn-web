<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduLearn | Subtest</title>
  <meta name="description" content="Halaman subtest untuk latihan soal matematika kelas 11." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="EduLearn home">
        <span class="brand-mark">E</span>
        <span>EduLearn</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html#materi">Materi</a>
        <a href="index.html#latihan">Latihan</a>
        <a href="index.html#progress">Perkembangan</a>
      </nav>

      <div class="nav-actions">
        <a class="btn btn-ghost" href="index.html#materi">Kembali ke Materi</a>
        <a class="btn btn-primary" href="index.html">Home</a>
      </div>

      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <main class="subtest-page">
    <section class="section">
      <div class="container">
        <div class="section-header center">
          <p>Halaman Subtest</p>
          <h2>Latihan khusus subtest PK dan PM</h2>
        </div>

        <div class="quiz-box subtest-box">
          <div class="quiz-controls">
            <div class="field-group compact">
              <label for="topicSelect">Pilih subtest</label>
              <select id="topicSelect"></select>
            </div>

            <div class="field-group compact">
              <label>Tingkat kesulitan</label>
              <div class="difficulty-group">
                <button class="difficulty-btn active" data-difficulty="mudah" type="button">Mudah</button>
                <button class="difficulty-btn" data-difficulty="sedang" type="button">Sedang</button>
                <button class="difficulty-btn" data-difficulty="susah" type="button">Susah</button>
              </div>
            </div>

            <div class="field-group compact">
              <label>Waktu</label>
              <div class="timer-adjust">
                <button id="decreaseTime" type="button">−</button>
                <input id="timerMinutes" type="number" min="1" max="60" value="10" />
                <button id="increaseTime" type="button">+</button>
              </div>
            </div>

            <div class="field-group compact">
              <label for="questionCount">Jumlah soal</label>
              <input id="questionCount" type="number" min="5" max="50" value="10" />
            </div>

            <label class="toggle-row">
              <input id="untimedMode" type="checkbox" />
              <span>Mode tanpa waktu</span>
            </label>
          </div>

          <div class="quiz-actions">
            <button id="startSubtest" class="btn btn-primary" type="button">Mulai Subtest</button>
            <button id="startExam" class="btn btn-secondary" type="button">Ujian Semua Materi</button>
          </div>

          <div id="quizArea" class="quiz-area hidden"></div>
          <div id="resultsArea" class="results-area hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <div>© <span id="current-year">2026</span> EduLearn. Semua hak dilindungi.</div>
      <div class="footer-links">
        <a href="index.html#materi">Materi</a>
        <a href="index.html#latihan">Latihan</a>
        <a href="index.html#progress">Perkembangan</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
